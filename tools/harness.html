<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Widget harness</title>
<style>
  body{margin:0;font-family:Georgia,serif;background:#fff;color:#222}
  .col{max-width:700px;margin:0 auto;padding:16px}
  iframe{width:100%;border:0;display:block;height:400px}
  p{line-height:1.6}
</style></head>
<body><div class="col">
<p>Post text above the widget. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Scroll past the widget on touch.</p>
<iframe id="w" sandbox="allow-scripts"></iframe>
<p>Post text below the widget. Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
<p style="height:900px">(spacer)</p>
</div>
<script>
// Mimic the LessWrong editor: load content via srcdoc in a sandboxed iframe (no same-origin),
// measure body.offsetHeight via an injected ResizeObserver, accept iframe-widget-resize messages.
const src = new URLSearchParams(location.search).get('src');
// optional: extra markup pasted after the widget code, to test leftovers from a bad paste
const append = new URLSearchParams(location.search).get('append') || '';
const f = document.getElementById('w');
fetch(src).then(r=>r.text()).then(html=>{
  const inject = `<script>(function(){function send(){var b=document.body;if(!b)return;var cs=getComputedStyle(b);var h=b.offsetHeight+parseFloat(cs.marginTop)+parseFloat(cs.marginBottom);parent.postMessage({type:'harness-measure',height:h},'*');}
  window.addEventListener('load',send);try{new ResizeObserver(send).observe(document.documentElement);}catch(e){} setInterval(send,500);})();<\/script>`;
  f.srcdoc = /<\/body>/i.test(html) ? html.replace(/<\/body>/i, append + inject + '</body>') : html + append + inject;
});
window.addEventListener('message', e=>{
  const d=e.data||{};
  if(d.type==='harness-measure'||d.type==='iframe-widget-resize'){
    const h=Math.max(50,Math.min(5000,Math.round(d.height)));
    f.style.height=h+'px'; window.__widgetHeight=h;
  }
});
</script></body></html>
