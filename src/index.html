<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Still Water</title>
<style>
  :root {
    --frame: #083b52;
    --frame-2: #0b4d6b;
    --ink: #eef8fb;
    --ink-dim: #9cc3d2;
    --coral: #ff6b4a;
    --gold: #ffd166;
    --ok: #3ddc97;
    --bad: #ff5a5f;
  }
  html, body { margin: 0; padding: 0; background: var(--frame); color: var(--ink); }
  body { font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #sw { position: relative; width: 100%; max-width: 700px; margin: 0 auto; background: var(--frame); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px 7px; min-height: 22px; }
  #title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; color: var(--ink-dim); }
  #title b { color: var(--ink); letter-spacing: 0.14em; font-weight: 800; margin-right: 6px; }
  #hud { display: flex; align-items: center; gap: 12px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #strikes { color: var(--bad); letter-spacing: 2px; }
  #strikes .off { color: rgba(255,255,255,0.25); }
  #lives { color: var(--coral); letter-spacing: 1px; }
  #clock { height: 4px; background: rgba(255,255,255,0.12); }
  #clock i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--coral)); }
  #stage { position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; touch-action: pan-y; cursor: crosshair; }
  #foot { display: flex; align-items: center; gap: 8px; padding: 8px 10px 10px; }
  #foot .grow { flex: 1; }
  button { font: inherit; color: var(--ink); background: rgba(255,255,255,0.08); border: 1px solid rgba(238,248,251,0.28); border-radius: 20px; min-width: 40px; height: 40px; padding: 0 12px; cursor: pointer; touch-action: manipulation; }
  button:hover:not(:disabled) { background: rgba(255,255,255,0.16); }
  button:disabled { opacity: 0.38; cursor: default; }
  button.primary { background: var(--coral); border-color: var(--coral); color: #fff; font-weight: 700; }
  button.primary:hover { background: #ff8366; }
  button.act { position: relative; overflow: hidden; font-weight: 700; padding: 0 14px; }
  button.act .cd { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--gold); width: 0; }
  button.act small { font-weight: 500; opacity: 0.8; }
  #callBtn.trusted { border-color: var(--ok); color: var(--ok); }
  .overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; box-sizing: border-box; background: rgba(5, 40, 58, 0.72); touch-action: pan-y; }
  .overlay.on { display: flex; }
  .card { background: rgba(6, 46, 66, 0.94); border: 1px solid rgba(255,255,255,0.18); border-radius: 16px; padding: 16px 18px; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
  .overlay h1 { margin: 0 0 6px; font-size: 40px; line-height: 1; letter-spacing: 0.12em; font-weight: 900; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,0.25); }
  .overlay h2 { margin: 0 0 8px; font-size: 22px; font-weight: 800; }
  .overlay .kicker { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: 4px; }
  .overlay p { margin: 6px 0 14px; color: var(--ink); }
  .overlay p b { color: var(--gold); }
  .overlay .sub { font-size: 16px; color: var(--ink); margin-bottom: 18px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #intro { background: linear-gradient(rgba(5,40,58,0.25), rgba(5,40,58,0.6)); }
  #menu { justify-content: flex-start; overflow-y: auto; }
  #menu .thread { width: 100%; max-width: 440px; text-align: left; margin: 4px 0 8px; }
  #menu h3 { margin: 0 0 2px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
  #menu .thread p { margin: 0 0 6px; font-size: 12px; color: var(--ink-dim); }
  #menu .lv { height: 34px; padding: 0 11px; margin: 0 4px 4px 0; font-size: 13px; }
  #menu .lv .s { color: var(--gold); margin-left: 5px; font-size: 11px; letter-spacing: -1px; }
  #menu .lv.locked { opacity: 0.35; }
  .stars { font-size: 30px; color: var(--gold); letter-spacing: 6px; margin: 2px 0 6px; }
  .stars .off { color: rgba(255,209,102,0.22); }
  #tapHint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: rgba(5,40,58,0.85); padding: 6px 12px; border-radius: 14px; font-size: 13px; display: none; pointer-events: none; }
  #tapHint.on { display: block; }
  @media (max-width: 400px) {
    button.act { padding: 0 10px; }
    #foot { gap: 6px; padding: 8px 8px 10px; }
    .overlay h1 { font-size: 34px; }
  }
</style>
</head>
<body>
<div id="sw">
  <div id="bar">
    <div id="title"><b>STILL WATER</b><span id="lvName"></span></div>
    <div id="hud"><span id="lives"></span><span id="strikes"></span><span id="score">0</span></div>
  </div>
  <div id="clock"><i></i></div>
  <div id="stage">
    <canvas id="c" aria-label="A beach seen from above: swimmers in the water, a lifeguard tower on the sand"></canvas>
    <div class="overlay on" id="intro">
      <h1>STILL WATER</h1>
      <div class="sub">You’re the lifeguard. Real drowning is quiet.</div>
      <div class="row"><button class="primary" id="playBtn">Play</button><button id="levelsBtn">Levels</button><button id="endlessBtn">Endless summer</button></div>
    </div>
    <div class="overlay" id="card"><div class="card">
      <div class="kicker" id="cKicker"></div>
      <h2 id="cTitle"></h2>
      <p id="cText"></p>
      <div class="row"><button class="primary" id="startBtn">Start shift</button></div>
    </div></div>
    <div class="overlay" id="menu"></div>
    <div class="overlay" id="pause"><div class="card"><h2>Paused</h2><div class="row"><button class="primary" id="resumeBtn">Resume</button></div></div></div>
    <div class="overlay" id="result"><div class="card">
      <div class="kicker" id="rKicker"></div>
      <h2 id="rTitle"></h2>
      <div class="stars" id="rStars"></div>
      <p id="rText"></p>
      <div class="row" id="rButtons"></div>
    </div></div>
    <div id="tapHint">Tap to play</div>
  </div>
  <div id="foot">
    <button class="act" id="whistleBtn" title="Whistle (space)">Whistle<span class="cd"></span></button>
    <button class="act" id="callBtn" title="Radio the Captain (C)">Call Captain</button>
    <span class="grow"></span>
    <button id="restartBtn" title="Restart (R)" aria-label="Restart">↺</button>
    <button id="menuBtn" title="Levels" aria-label="Levels">☰</button>
    <button id="soundBtn" title="Sound" aria-label="Sound">♪</button>
  </div>
</div>
<!--SCRIPTS-->
</body>
</html>
