<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hush</title>
<style>
  :root {
    --ink: #c9d1ef;
    --ink-dim: #7b84a8;
    --bg: #0b0f22;
    --panel: rgba(14, 18, 40, 0.92);
    --accent: #ff6a5c;
    --water: #8fd8ff;
    --gold: #ffd27a;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body { font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #hush { position: relative; width: 100%; max-width: 700px; margin: 0 auto; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 6px; gap: 8px; min-height: 28px; }
  #title { font-family: Georgia, "Times New Roman", serif; letter-spacing: 0.08em; font-size: 13px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #title b { color: var(--ink); font-weight: normal; letter-spacing: 0.12em; }
  #meters { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-dim); }
  .drop { display: inline-block; width: 10px; height: 14px; margin-left: 2px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(180deg); border: 1.5px solid var(--water); box-sizing: border-box; position: relative; overflow: hidden; vertical-align: -2px; }
  .drop i { position: absolute; left: 0; right: 0; top: 0; background: var(--water); }
  #stage { position: relative; }
  canvas { display: block; width: 100%; touch-action: pan-y; }
  #foot { display: flex; align-items: center; gap: 8px; padding: 6px 10px 10px; }
  #hint { flex: 1; font-family: Georgia, serif; font-style: italic; color: var(--ink); font-size: 14px; min-height: 19px; }
  button { font: inherit; color: var(--ink); background: rgba(255,255,255,0.06); border: 1px solid rgba(201,209,239,0.22); border-radius: 18px; min-width: 40px; height: 36px; padding: 0 12px; cursor: pointer; touch-action: manipulation; }
  button:hover { background: rgba(255,255,255,0.12); }
  button.primary { background: rgba(255,106,92,0.18); border-color: rgba(255,106,92,0.6); }
  .overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; box-sizing: border-box; background: radial-gradient(ellipse at center, rgba(11,15,34,0.55), rgba(11,15,34,0.88)); touch-action: pan-y; }
  .overlay.on { display: flex; }
  .overlay h1 { font-family: Georgia, serif; font-weight: normal; letter-spacing: 0.4em; margin: 0 0 4px 0.4em; font-size: 38px; }
  .overlay h2 { font-family: Georgia, serif; font-weight: normal; letter-spacing: 0.12em; margin: 0 0 8px; font-size: 22px; }
  .overlay p { margin: 4px 0 14px; max-width: 30em; color: var(--ink); }
  .overlay .sub { color: var(--ink-dim); font-style: italic; font-family: Georgia, serif; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #menu .thread { margin: 6px 0; width: 100%; max-width: 420px; text-align: left; }
  #menu .thread h3 { margin: 0 0 4px; font: 12px/1 -apple-system, sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-dim); }
  #menu .lv { min-width: 0; padding: 0 10px; height: 34px; margin: 0 4px 4px 0; }
  #menu .lv .s { color: var(--gold); font-size: 11px; margin-left: 4px; letter-spacing: -1px; }
  #menu .lv.locked { opacity: 0.35; }
  .stars { font-size: 26px; color: var(--gold); letter-spacing: 6px; margin: 4px 0 8px; }
  .stars .off { color: rgba(255,210,122,0.2); }
  #share { width: 100%; max-width: 360px; font: 13px/1.4 ui-monospace, Menlo, monospace; background: rgba(255,255,255,0.05); color: var(--ink); border: 1px solid rgba(201,209,239,0.2); border-radius: 8px; padding: 8px; box-sizing: border-box; resize: none; display: none; margin-bottom: 10px; }
</style>
</head>
<body>
<div id="hush">
  <div id="bar">
    <div id="title"><b>HUSH</b> · a night garden</div>
    <div id="meters"><span id="water" aria-label="water"></span><span id="certs"></span></div>
  </div>
  <div id="stage">
    <canvas id="c" aria-label="Night garden"></canvas>
    <div class="overlay" id="intro">
      <h1>HUSH</h1>
      <p class="sub">Flowers open when they need water.<br>Until they can’t.</p>
      <div class="row"><button class="primary" id="playBtn">Play</button><button id="levelsBtn">Levels</button><button id="nightBtn">Endless night</button></div>
    </div>
    <div class="overlay" id="menu"></div>
    <div class="overlay" id="result">
      <h2 id="rTitle"></h2>
      <div class="stars" id="rStars"></div>
      <p id="rText"></p>
      <textarea id="share" rows="3" readonly></textarea>
      <div class="row" id="rButtons"></div>
    </div>
  </div>
  <div id="foot">
    <div id="hint"></div>
    <button id="restartBtn" title="Restart" aria-label="Restart">↺</button>
    <button id="menuBtn" title="Levels" aria-label="Levels">☰</button>
    <button id="soundBtn" title="Sound" aria-label="Sound">♪</button>
  </div>
</div>
<!--SCRIPTS-->
</body>
</html>
