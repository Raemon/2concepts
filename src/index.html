<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Still Water</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap">
<style>
  /* Layout: one cyanotype print on a cool paper sheet, captioned and labelled like a 19th-century specimen plate. */
  :root {
    --paper: #f2f3ee;
    --paper-2: #e4e8e6;
    --ink: #0a2560;
    --prussian: #123d8f;
    --rule: rgba(10, 37, 96, 0.28);
    --red: #df3a2c;
    --yellow: #ffc83a;
    --violet: #6b3db3;
    --f-display: "IM Fell English SC", "IM Fell English", Georgia, "Times New Roman", serif;
    --f-italic: "IM Fell English", Georgia, "Times New Roman", serif;
    --f-ui: Archivo, "Helvetica Neue", Helvetica, Arial, sans-serif;
    color-scheme: light;
  }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  body { font: 14px/1.4 var(--f-ui); }
  #sw { position: relative; width: 100%; max-width: 700px; margin: 0 auto; background: var(--paper); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #bar { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 10px 14px 2px; min-height: 24px; }
  #title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--f-display); font-size: 20px; letter-spacing: 0.05em; color: var(--ink); }
  #title b { font-weight: normal; }
  #lvName { font-family: var(--f-italic); font-style: italic; font-size: 16px; letter-spacing: 0; color: var(--prussian); margin-left: 10px; }
  #hud { display: flex; align-items: baseline; gap: 12px; font: 800 15px var(--f-ui); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink); }
  #strikes, #lives { color: var(--red); letter-spacing: 2px; font-size: 13px; }
  #strikes .off { color: var(--rule); }
  /* the shift is an exposure: the sun moves along the rule */
  #clock { position: relative; height: 14px; margin: 0 16px; }
  #clock::before { content: ''; position: absolute; left: 0; right: 0; top: 7px; border-top: 1px solid var(--rule); }
  #clock i { position: absolute; left: 0; top: 6px; width: 0; border-top: 2px solid var(--prussian); }
  #clock i::after { content: ''; position: absolute; right: -6px; top: -7px; width: 10px; height: 10px; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 0 2px var(--paper), 0 0 0 3px var(--prussian); }
  #stage { position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; touch-action: pan-y; cursor: crosshair; }
  #foot { display: flex; align-items: center; gap: 8px; padding: 4px 14px 14px; }
  #foot .grow { flex: 1; }
  button { font: 700 12px/1 var(--f-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); background: transparent; border: 1.5px solid var(--ink); border-radius: 2px; min-width: 38px; height: 38px; padding: 0 14px; cursor: pointer; touch-action: manipulation; }
  button:hover:not(:disabled) { background: rgba(18, 61, 143, 0.08); }
  button:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
  button:disabled { opacity: 0.35; cursor: default; }
  button.primary { background: var(--prussian); border-color: var(--prussian); color: var(--paper); }
  button.primary:hover:not(:disabled) { background: var(--ink); }
  button.icon { padding: 0; font-size: 17px; letter-spacing: 0; text-transform: none; font-weight: 500; }
  button.act { position: relative; overflow: hidden; }
  button.act .cd { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--yellow); width: 0; }
  button.act small { font-weight: 500; letter-spacing: 0.02em; text-transform: none; opacity: 0.85; }
  #callBtn.trusted { color: var(--violet); border-color: var(--violet); }
  .overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 18px; box-sizing: border-box; background: rgba(10, 37, 96, 0.5); touch-action: pan-y; }
  .overlay.on { display: flex; }
  .card { background: var(--paper); color: var(--ink); border: 1px solid var(--ink); box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 3.6px var(--ink), 0 14px 34px rgba(5, 20, 60, 0.35); padding: 20px 22px 18px; max-width: 360px; }
  .overlay h2 { margin: 2px 0 8px; font: normal 30px/1.05 var(--f-display); letter-spacing: 0.02em; text-wrap: balance; }
  .kicker { font: 700 10.5px var(--f-ui); letter-spacing: 0.2em; text-transform: uppercase; color: var(--prussian); }
  .kicker.bad { color: var(--red); }
  .overlay p { margin: 6px 0 16px; font-size: 14.5px; line-height: 1.45; }
  .overlay p b { font-weight: 700; box-shadow: inset 0 -0.38em 0 rgba(255, 200, 58, 0.6); }
  .overlay p small { color: var(--prussian); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  /* the title sits on the print itself, lettered in paper white */
  #intro { background: radial-gradient(ellipse at 50% 45%, rgba(10, 37, 96, 0.55), rgba(10, 37, 96, 0) 70%); color: var(--paper); }
  #intro h1 { margin: 0; font: normal 58px/0.95 var(--f-display); letter-spacing: 0.04em; text-shadow: 0 2px 14px rgba(5, 20, 60, 0.5); }
  #intro .rule { width: 160px; height: 0; border-top: 1px solid rgba(242, 243, 238, 0.7); margin: 12px auto 10px; }
  #intro .sub { font: italic 19px/1.3 var(--f-italic); margin-bottom: 20px; text-shadow: 0 1px 8px rgba(5, 20, 60, 0.6); }
  #intro button { color: var(--paper); border-color: var(--paper); background: rgba(10, 37, 96, 0.25); }
  #intro button:hover { background: rgba(242, 243, 238, 0.15); }
  #intro button.primary { background: var(--paper); color: var(--ink); }
  #menu { background: var(--paper); color: var(--ink); justify-content: flex-start; overflow-y: auto; padding-top: 22px; }
  #menu h2 { margin-bottom: 4px; }
  #menu .thread { width: 100%; max-width: 440px; text-align: left; margin: 8px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule); }
  #menu h3 { margin: 0 0 2px; font: 700 10.5px var(--f-ui); letter-spacing: 0.2em; text-transform: uppercase; color: var(--prussian); }
  #menu .thread p { margin: 0 0 8px; font: italic 14px var(--f-italic); color: var(--ink); }
  #menu .lv { height: 34px; padding: 0 11px; margin: 0 5px 5px 0; font-size: 11.5px; }
  #menu .lv .s { color: var(--yellow); -webkit-text-stroke: 0.6px var(--ink); margin-left: 6px; letter-spacing: 0; font-size: 12px; }
  #menu .lv.locked { opacity: 0.4; }
  .stars { font-size: 32px; color: var(--yellow); -webkit-text-stroke: 1px var(--ink); letter-spacing: 6px; margin: 2px 0 4px; }
  .stars .off { color: transparent; -webkit-text-stroke: 1px var(--rule); }
  #tapHint { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--paper); color: var(--ink); border: 1px solid var(--ink); padding: 6px 12px; font: 700 11px var(--f-ui); letter-spacing: 0.12em; text-transform: uppercase; display: none; pointer-events: none; }
  #tapHint.on { display: block; }
  @media (max-width: 400px) {
    #foot { gap: 6px; padding: 4px 10px 12px; }
    button { padding: 0 10px; letter-spacing: 0.05em; }
    #intro h1 { font-size: 46px; }
    #title { font-size: 18px; }
    #lvName { font-size: 14px; margin-left: 6px; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
</head>
<body>
<div id="sw">
  <div id="bar">
    <div id="title"><b>Still Water</b><span id="lvName"></span></div>
    <div id="hud"><span id="lives"></span><span id="strikes"></span><span id="score">0</span></div>
  </div>
  <div id="clock"><i></i></div>
  <div id="stage">
    <canvas id="c" aria-label="A beach seen from above, printed in blue: swimmers in engraved water, a lifeguard tower on the sand"></canvas>
    <div class="overlay on" id="intro">
      <h1>Still Water</h1>
      <div class="rule"></div>
      <div class="sub">You’re the lifeguard. Real drowning is quiet.</div>
      <div class="row"><button class="primary" id="playBtn">Play</button><button id="levelsBtn">Shifts</button><button id="endlessBtn">Endless summer</button></div>
    </div>
    <div class="overlay" id="card"><div class="card">
      <div class="kicker" id="cKicker"></div>
      <h2 id="cTitle"></h2>
      <p id="cText"></p>
      <div class="row"><button class="primary" id="startBtn">Start shift</button></div>
    </div></div>
    <div class="overlay" id="menu"></div>
    <div class="overlay" id="pause"><div class="card"><h2>Paused</h2><div class="row"><button class="primary" id="resumeBtn">Resume</button></div></div></div>
    <div class="overlay" id="result"><div class="card">
      <div class="kicker" id="rKicker"></div>
      <h2 id="rTitle"></h2>
      <div class="stars" id="rStars"></div>
      <p id="rText"></p>
      <div class="row" id="rButtons"></div>
    </div></div>
    <div id="tapHint">Tap to play</div>
  </div>
  <div id="foot">
    <button class="act" id="whistleBtn" title="Whistle (space)">Whistle<span class="cd"></span></button>
    <button class="act" id="callBtn" title="Radio the Captain (C)">Call Captain</button>
    <span class="grow"></span>
    <button class="icon" id="restartBtn" title="Restart (R)" aria-label="Restart">↺</button>
    <button class="icon" id="menuBtn" title="Shifts" aria-label="Shifts">☰</button>
    <button class="icon" id="soundBtn" title="Sound" aria-label="Sound">♪</button>
  </div>
</div>
<!--SCRIPTS-->
</body>
</html>
